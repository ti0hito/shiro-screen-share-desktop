<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			background: #2d2d2d;
			color: #fff;
			padding: 10px;
			margin: 0;
		}
		.field { margin-bottom: 12px; }
		label {
			display: block;
			font-size: 11px;
			color: #aaa;
			margin-bottom: 4px;
		}
		input[type="number"] {
			width: 100%;
			padding: 6px 8px;
			border: 1px solid #555;
			border-radius: 4px;
			background: #1a1a1a;
			color: #fff;
			font-size: 12px;
			box-sizing: border-box;
		}
		input:focus { outline: none; border-color: #60a5fa; }
		.hint { font-size: 10px; color: #888; margin-top: 4px; }
	</style>
</head>
<body>
	<div class="field">
		<label for="sourceIndex">Source Index</label>
		<input type="number" id="sourceIndex" min="0" value="0">
		<div class="hint">Index of the window/screen to preview (0 = first). Click the button to switch the stream to this source.</div>
	</div>

	<script>
		var websocket = null;
		var pluginUUID = null;
		var actionInfo = null;

		function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo) {
			pluginUUID = inPluginUUID;
			actionInfo = JSON.parse(inActionInfo);

			websocket = new WebSocket("ws://127.0.0.1:" + inPort);

			websocket.onopen = function () {
				websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: pluginUUID }));
			};

			websocket.onmessage = function (evt) {
				var msg = JSON.parse(evt.data);
				if (msg.event === "didReceiveSettings") {
					var s = msg.payload?.settings || {};
					document.getElementById("sourceIndex").value = s.sourceIndex ?? 0;
				}
			};
		}

		function sendValueToPlugin(val) {
			if (!websocket || websocket.readyState !== 1) return;
			websocket.send(JSON.stringify({
				event: "sendToPlugin",
				context: actionInfo.context,
				action: actionInfo.action,
				payload: { key: "sourceIndex", value: val }
			}));
		}

		function saveSettings() {
			var val = parseInt(document.getElementById("sourceIndex").value) || 0;
			sendValueToPlugin(val);
		}

		document.getElementById("sourceIndex").addEventListener("change", saveSettings);
		document.getElementById("sourceIndex").addEventListener("input", saveSettings);
	</script>
</body>
</html>
