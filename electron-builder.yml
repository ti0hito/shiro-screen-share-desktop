appId: com.shiro.screenshare
productName: Shiro Screen Share
publish:
  provider: github
  owner: ti0hito
  repo: shiro-screen-share-desktop
directories:
  output: release
  buildResources: build
files:
  - "dist/main/**/*"
  - "dist/preload/**/*"
  - "dist/renderer/**/*"
  - "node_modules/**/*"
  - "package.json"
  - "icon.ico"
extraResources:
  - icon.ico
win:
  target:
    - nsis
    - portable
  icon: icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shiro - Screen Share
